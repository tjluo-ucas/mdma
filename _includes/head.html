<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b2e">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title | default: site.title }} · {{ site.title }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  {% if page.translation_url %}
    {% if page.lang == 'en' %}
      <link rel="alternate" hreflang="zh-CN" href="{{ page.translation_url | absolute_url }}">
      <link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}">
    {% else %}
      <link rel="alternate" hreflang="zh-CN" href="{{ page.url | absolute_url }}">
      <link rel="alternate" hreflang="en" href="{{ page.translation_url | absolute_url }}">
    {% endif %}
  {% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
