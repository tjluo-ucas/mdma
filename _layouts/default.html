<!doctype html>
<html lang="{{ page.lang | default: site.default_lang }}">
  {% include head.html %}
  <body class="page-{{ page.page_key | default: 'content' }}">
    <a class="skip-link" href="#main-content">{% if page.lang == 'en' %}Skip to content{% else %}跳到正文{% endif %}</a>
    {% include header.html %}
    <main id="main-content">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
